<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExTracker - Premium Expense Management</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <i class="fas fa-chart-line"></i>
                <h1>ExTracker</h1>
            </div>
            <div class="header-stats">
                <div class="stat-card">
                    <span class="stat-value" id="totalExpenses">₹0</span>
                    <span class="stat-label">Total This Month</span>
                </div>
                <div class="stat-card">
                    <span class="stat-value" id="pendingPayments">0</span>
                    <span class="stat-label">Pending Payments</span>
                </div>
            </div>
        </header>

        <!-- Navigation -->
        <nav class="nav-tabs">
            <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
            <button class="tab-btn" data-tab="emis">EMIs</button>
            <button class="tab-btn" data-tab="credit-cards">Credit Cards</button>
            <button class="tab-btn" data-tab="monthly-bills">Monthly Bills</button>
            <button class="tab-btn" data-tab="daily-expenses">Daily Expenses</button>
        </nav>

        <!-- Dashboard Tab -->
        <div class="tab-content active" id="dashboard">
            <div class="dashboard-grid">
                <div class="card overview-card">
                    <h3><i class="fas fa-chart-pie"></i> Monthly Overview</h3>
                    <canvas id="expenseChart"></canvas>
                </div>
                <div class="card upcoming-card">
                    <h3><i class="fas fa-clock"></i> Upcoming Payments</h3>
                    <div id="upcomingPayments" class="payment-list"></div>
                </div>
                <div class="card quick-add">
                    <h3><i class="fas fa-plus"></i> Quick Add Expense</h3>
                    <form id="quickExpenseForm">
                        <input type="text" placeholder="Description" required>
                        <input type="number" placeholder="Amount" required>
                        <select required>
                            <option value="">Category</option>
                            <option value="food">Food</option>
                            <option value="transport">Transport</option>
                            <option value="shopping">Shopping</option>
                            <option value="other">Other</option>
                        </select>
                        <button type="submit">Add Expense</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- EMIs Tab -->
        <div class="tab-content" id="emis">
            <div class="section-header">
                <h2><i class="fas fa-calendar-check"></i> EMI Management</h2>
                <button class="add-btn" onclick="openModal('emiModal')">Add EMI</button>
            </div>
            <div class="cards-grid" id="emiCards"></div>
        </div>

        <!-- Credit Cards Tab -->
        <div class="tab-content" id="credit-cards">
            <div class="section-header">
                <h2><i class="fas fa-credit-card"></i> Credit Card Bills</h2>
                <button class="add-btn" onclick="openModal('creditCardModal')">Add Bill</button>
            </div>
            <div class="cards-grid" id="creditCardCards"></div>
        </div>

        <!-- Monthly Bills Tab -->
        <div class="tab-content" id="monthly-bills">
            <div class="section-header">
                <h2><i class="fas fa-file-invoice-dollar"></i> Monthly Bills</h2>
                <button class="add-btn" onclick="openModal('monthlyBillModal')">Add Bill</button>
            </div>
            <div class="cards-grid" id="monthlyBillCards"></div>
        </div>

        <!-- Daily Expenses Tab -->
        <div class="tab-content" id="daily-expenses">
            <div class="section-header">
                <h2><i class="fas fa-shopping-cart"></i> Daily Expenses</h2>
                <button class="add-btn" onclick="openModal('dailyExpenseModal')">Add Expense</button>
            </div>
            <div class="expense-summary">
                <div class="summary-card">
                    <span class="summary-value" id="todayExpenses">₹0</span>
                    <span class="summary-label">Today</span>
                </div>
                <div class="summary-card">
                    <span class="summary-value" id="weekExpenses">₹0</span>
                    <span class="summary-label">This Week</span>
                </div>
                <div class="summary-card">
                    <span class="summary-value" id="monthExpenses">₹0</span>
                    <span class="summary-label">This Month</span>
                </div>
            </div>
            <div class="expense-list" id="dailyExpenseList"></div>
        </div>
    </div>

    <!-- Modals -->
    <div id="emiModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('emiModal')">&times;</span>
            <h3>Add EMI</h3>
            <form id="emiForm">
                <input type="text" placeholder="EMI Name" required>
                <input type="number" placeholder="Monthly Amount" required>
                <input type="date" placeholder="Due Date" required>
                <input type="number" placeholder="Remaining Months" required>
                <button type="submit">Add EMI</button>
            </form>
        </div>
    </div>

    <div id="creditCardModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('creditCardModal')">&times;</span>
            <h3>Add Credit Card Bill</h3>
            <form id="creditCardForm">
                <input type="text" placeholder="Card Name" required>
                <input type="number" placeholder="Amount" required>
                <input type="date" placeholder="Due Date" required>
                <button type="submit">Add Bill</button>
            </form>
        </div>
    </div>

    <div id="monthlyBillModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('monthlyBillModal')">&times;</span>
            <h3>Add Monthly Bill</h3>
            <form id="monthlyBillForm">
                <input type="text" placeholder="Bill Name" required>
                <input type="number" placeholder="Amount" required>
                <input type="date" placeholder="Due Date" required>
                <select required>
                    <option value="">Category</option>
                    <option value="utilities">Utilities</option>
                    <option value="subscription">Subscription</option>
                    <option value="rent">Rent</option>
                    <option value="other">Other</option>
                </select>
                <button type="submit">Add Bill</button>
            </form>
        </div>
    </div>

    <div id="dailyExpenseModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('dailyExpenseModal')">&times;</span>
            <h3>Add Daily Expense</h3>
            <form id="dailyExpenseForm">
                <input type="text" placeholder="Description" required>
                <input type="number" placeholder="Amount" required>
                <select required>
                    <option value="">Category</option>
                    <option value="food">Food & Dining</option>
                    <option value="grocery">Grocery</option>
                    <option value="transport">Transport</option>
                    <option value="shopping">Shopping</option>
                    <option value="entertainment">Entertainment</option>
                    <option value="other">Other</option>
                </select>
                <button type="submit">Add Expense</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
